[project]
name = "radar-pd-nova"
version = "0.3.61"
description = "Interactive NDIP/NOVA workspace for RADAR-PD"
requires-python = ">=3.10,<3.14"
dependencies = [
  "nova-galaxy>=0.11.6,<0.12",
  "nova-trame>=1.7,<2",
  "plotly>=5.24,<7",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "trame-datagrid>=0.2.2,<1",
  "trame-plotly>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_pd_nova"]

[tool.pytest.ini_options]
testpaths = ["tests"]
