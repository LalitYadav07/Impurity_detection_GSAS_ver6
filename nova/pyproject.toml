[project]
name = "radar-pd-nova"
version = "0.6.11"
description = "Interactive NDIP/NOVA workspace for RADAR-PD"
requires-python = ">=3.10,<3.14"
dependencies = [
  "nova-galaxy>=0.11.6,<0.12",
  "nova-trame>=1.7,<2",
  "plotly>=5.24,<7",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "numpy>=1.26,<3",
  "h5py>=3.10,<4",
  "scipy>=1.11,<2",
  "RapidFuzz>=3.14.3,<4",
  "trame-datagrid>=0.2.2,<1",
  "trame-plotly>=3.1,<4",
]

[project.optional-dependencies]
battery = ["galvani==0.5.0"]
transition-ml = ["torch>=2.5.1,<3"]
dev = ["pytest>=8,<9", "h5py>=3.10,<4", "jsonschema>=4,<5", "Cheetah3>=3.2.6,<4"]
k-discovery = ["seekpath==2.2.1", "spglib==2.7.0; python_version < '3.11'", "spglib==2.8.0; python_version >= '3.11'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_pd_nova", "src/gpx_recipe"]

[tool.hatch.build.targets.wheel.force-include]
"src/radar_pd_nova/unet_core/assets/best.pt" = "radar_pd_nova/unet_core/assets/best.pt"
"src/radar_pd_nova/unet_core/assets/receipt.json" = "radar_pd_nova/unet_core/assets/receipt.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
