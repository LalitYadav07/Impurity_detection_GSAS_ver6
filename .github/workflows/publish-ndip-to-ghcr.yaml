name: Publish NDIP image to GitHub Container Registry

on:
  push:
    branches:
      - birthright-container
    paths:
      - Dockerfile.ndip
      - requirements.txt
      - scripts/**
      - schemas/**
      - ML_components/**
      - ML_ranker/**
      - .github/workflows/publish-ndip-to-ghcr.yaml
  workflow_dispatch: {}

concurrency:
  group: publish-ndip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push NDIP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ndip
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:ndip
            ${{ env.IMAGE_NAME }}:ndip-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:ndip-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:ndip-buildcache,mode=max
