name: Publish NDIP image to GitHub Container Registry

on:
  push:
    branches:
      - birthright-container
    paths:
      - Dockerfile.ndip
      - .dockerignore
      - requirements.txt
      - scripts/**
      - tests/test_image_scientific_contract.py
      - tests/test_production_image_payload.py
      - nova/src/gpx_recipe/**
      - nova/src/radar_pd_nova/signal_quality.py
      - schemas/**
      - ML_components/**
      - ML_ranker/**
      - .github/workflows/publish-ndip-to-ghcr.yaml
  workflow_dispatch: {}

concurrency:
  group: publish-ndip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load NDIP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ndip
          build-args: |
            RADAR_PD_BUILD_SHA=${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:ndip
            ${{ env.IMAGE_NAME }}:ndip-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:ndip-buildcache-v2
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:ndip-buildcache-v2,mode=max

      - name: Verify production image excludes development fixtures
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/tests/test_production_image_payload.py:/validation/test_production_image_payload.py:ro" \
            "${IMAGE_NAME}:ndip-${GITHUB_SHA}" \
            /validation/test_production_image_payload.py --image-kind ndip

      - name: Verify native TOF profile recovery in the built image
        shell: bash
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/validation:ro" \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
            "${IMAGE_NAME}:ndip-${GITHUB_SHA}" -c '
          python -m pip install --quiet pytest &&
          cd /tmp &&
          python -m pytest -q -o cache_dir=/tmp/pytest-cache \
            /validation/tests/gpx_recipe/test_tof_profile_native.py'

      - name: Check scientific contracts in the built image
        shell: bash
        run: |
          docker run --rm --entrypoint python "${IMAGE_NAME}:ndip-${GITHUB_SHA}" -c '
          from lattice_nudger import bootstrap_fraction_window
          from gsas_main_phase_refiner import candidate_cell_rejection
          from ndip_lattice import lattice_quality
          from ndip_input_provenance import read_input_provenance, PREFIX
          from ndip_outputs import collect_outputs
          from gpx_recipe.worker import work as refinement_work
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import json
          import importlib.metadata
          runtime = json.loads(importlib.metadata.distribution("GSAS-II").read_text("direct_url.json"))
          assert runtime["vcs_info"]["commit_id"] == "b97e05bfa41eea5bfcc265ed2eb28482c0afaca6", runtime
          from GSASII import GSASIIscriptable
          from gsas_cif_import import add_verified_phase, elemental_counts
          from gsas_legacy_bridge import write_dummy_nacl_cif
          import ndip_pattern_observation
          from radar_pd_nova.signal_quality import supplied_error_signal_quality
          assert supplied_error_signal_quality([1e-8, 2e-8], [0.01, 0.01])["needs_review"]
          assert bootstrap_fraction_window({"len_tol_pct": 0.6}) == 0.006
          cell = [4.8, 4.8, 13., 90., 90., 120.]
          assert candidate_cell_rejection(cell, [5.7, 5.7, 15.5, 90., 90., 120.], .59, .60)
          assert candidate_cell_rejection(cell, cell, .59, .58)
          assert not candidate_cell_rejection(cell, cell, .59, .60)
          assert lattice_quality([]) == []
          with TemporaryDirectory() as folder:
              root = Path(folder)
              bootstrap_cif = write_dummy_nacl_cif(str(root))
              project = GSASIIscriptable.G2Project(newgpx=str(root / "bootstrap.gpx"))
              phase = add_verified_phase(project, bootstrap_cif, phasename="bootstrap", histograms=[])
              assert elemental_counts(phase.data["General"]["NoAtoms"]) == {"Na": 4.0, "Cl": 4.0}
              metadata = {"schema": "radar-pd-input-provenance/v1", "instrument": "NOM", "source_bank": 5, "warnings": [{"code": "unverified_nomad_profile", "message": "NOMAD scientific calibration acceptance is pending"}]}
              source = root / "bank.gsa"
              source.write_bytes(PREFIX + json.dumps(metadata).encode() + b"\nBANK 1 1 1 SLOG 1 2 .1 0 FXYE\n1 2 3\n")
              run = root / "run"
              run.mkdir()
              (run / "input_provenance.json").write_text(json.dumps(read_input_provenance(source)))
              result = collect_outputs(run, root / "portal", mode="full", include_archive=False)
              assert result["scientific_status"] == "needs_review"
              assert result["provenance"]["input"]["source_bank"] == 5
              assert "NOMAD scientific calibration acceptance is pending" in (root / "portal/report.html").read_text()
          print("Scientific and refinement contract checks passed", refinement_work.__name__)
          '

      - name: Verify packaged reviewed-preparation implementation
        shell: bash
        run: |
          docker run --rm --entrypoint python "${IMAGE_NAME}:ndip-${GITHUB_SHA}" -c '
          from gpx_recipe.symmetry.compiler import package_signature
          from gpx_recipe.battery.transport import implementation_signature
          from gpx_recipe.worker import work
          from GSASII import GSASIIpwd
          from gpx_recipe.live.native_peak_batch import NativePeakBatch
          assert len(package_signature()) == 64
          assert len(implementation_signature()) == 64
          helper=NativePeakBatch(GSASIIpwd)
          assert helper.diagnostics()["interpolation"] is False
          assert hasattr(helper.library,"proposal_tof_profile_sum")
          print("Reviewed preparation package and adapter identities available", work.__name__)'

      - name: Verify recipe recovery and structural handoffs in the built worker
        shell: bash
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/tests/gpx_recipe:/validation:ro" \
            "${IMAGE_NAME}:ndip-${GITHUB_SHA}" -c '
            python -m pip install --quiet pytest &&
            export PYTHONPATH="/validation${PYTHONPATH:+:$PYTHONPATH}" RADAR_REQUIRE_STRUCTURAL_NATIVE=1 &&
            python -m pytest -q -o cache_dir=/tmp/pytest-cache \
              /validation/test_stage_recovery.py \
              /validation/test_effects.py \
              /validation/test_imported_mode_reset.py \
              /validation/test_imported_mode_recipe_native.py \
              /validation/test_native_budget_recipe_native.py \
              /validation/test_guided_numeric_native.py \
              /validation/test_native_budget.py \
              /validation/test_solver_plan_limits.py'

      - name: Verify complete CIF symmetry evidence in the built worker
        shell: bash
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/tests/test_cif_space_group_evidence.py:/validation/test_cif_space_group_evidence.py:ro" \
            "${IMAGE_NAME}:ndip-${GITHUB_SHA}" -c '
            python -m pip install --quiet pytest==8.4.2 &&
            PYTHONPATH=/opt/radar-pd/scripts python -m pytest -q -o cache_dir=/tmp/pytest-cache \
              /validation/test_cif_space_group_evidence.py'

      - name: Verify phase-composition interpretation in the built worker
        shell: bash
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/tests/test_ndip_phase_models.py:/validation/test_ndip_phase_models.py:ro" \
            "${IMAGE_NAME}:ndip-${GITHUB_SHA}" -c '
            python -m pip install --quiet pytest==8.4.2 &&
            PYTHONPATH="/opt/radar-pd:$PYTHONPATH" python -m pytest -q -o cache_dir=/tmp/pytest-cache \
              /validation/test_ndip_phase_models.py'

      - name: Check phase discovery regressions in the scientific runtime
        shell: bash
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/validation:ro" "${IMAGE_NAME}:ndip-${GITHUB_SHA}" -c '
          cd /validation/tests &&
          python -m unittest test_lattice_nudger_regressions test_refiner_regressions test_db_pack_regressions test_ndip_lattice_covariance_native test_ndip_export_schema test_gsas_signed_fxye_native test_main_phase_identity test_image_scientific_contract test_library_cli_intake test_library_fingerprint_guard'

      - name: Verify shared scientific worker allocation
        shell: bash
        run: |
          docker run --rm --cpus 4 --memory 8g --entrypoint sh -v "$PWD:/validation:ro" \
            "${IMAGE_NAME}:ndip-${GITHUB_SHA}" -c '
            python -m pip install --quiet pytest &&
            python -m pytest -q -o cache_dir=/tmp/pytest-cache \
              /validation/tests/test_analysis_worker_budget.py'

      - name: Push Docker schema v2 manifests
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:ndip-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == "refs/heads/birthright-container" ]]; then
            docker push "${IMAGE_NAME}:ndip"
          fi
