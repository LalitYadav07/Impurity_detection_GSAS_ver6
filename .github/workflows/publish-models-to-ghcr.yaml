          python -m pytest -q -o cache_dir=/tmp/pytest-cache \
            /validation/tests/gpx_recipe/test_model_campaign_worker.py \
            /validation/tests/gpx_recipe/test_stage_recovery.py \
            /validation/tests/gpx_recipe/test_imported_mode_reset.py \
            /validation/tests/gpx_recipe/test_effects.py \
            /validation/tests/gpx_recipe/test_imported_mode_recipe_native.py \
            /validation/tests/gpx_recipe/test_native_budget_recipe_native.py \
            /validation/tests/gpx_recipe/test_guided_numeric_native.py \
            /validation/tests/gpx_recipe/test_native_budget.py \
