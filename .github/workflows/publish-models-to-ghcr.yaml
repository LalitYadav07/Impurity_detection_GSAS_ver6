name: Publish model campaign worker to GitHub Container Registry

on:
  push:
    branches: [birthright-container]
    paths:
      - Dockerfile.symmetry
      - nova/src/gpx_recipe/**
      - tests/gpx_recipe/test_prepared_structural_acceptance_native.py
      - tests/gpx_recipe/test_structural_block_damping.py
      - tests/gpx_recipe/test_preparation*.py
      - tests/gpx_recipe/test_prepared_k_series_native.py
      - tests/gpx_recipe/test_prepared_model_handoff_native.py
      - tests/gpx_recipe/test_preparation_rendered_magnetic.py
      - tests/gpx_recipe/test_prepared_rendered_oracle_native.py
      - tests/gpx_recipe/test_native_background*.py
      - tests/gpx_recipe/test_native_peak_precision*.py
      - tests/gpx_recipe/test_native_peak_memo*.py
      - tests/gpx_recipe/test_native_axis_view*.py
      - tests/gpx_recipe/test_native_reflection_memo*.py
      - tests/gpx_recipe/test_native_tof_scalars.py
      - tests/gpx_recipe/test_native_tof_forward.py
      - tests/gpx_recipe/test_native_tof_kernels.py
      - tests/gpx_recipe/test_native_kernel_pass.py
      - tests/gpx_recipe/test_native_kernel_geometry.py
      - tests/gpx_recipe/test_native_kernel_bank.py
      - tests/gpx_recipe/test_kernel_geometry_storage.py
      - tests/gpx_recipe/test_native_joint_profiled_fit.py
      - tests/gpx_recipe/test_tof_kernel_storage.py
      - tests/gpx_recipe/test_native_cell_proposals.py
      - tests/gpx_recipe/test_structural_background_context*.py
      - tests/gpx_recipe/test_structural_snapshot_job_native.py
      - tests/gpx_recipe/data/synthetic-ersi-cmcm-isodistort.cif
      - scripts/ndip_model_campaign.py
      - scripts/ndip_runtime.py
      - scripts/ndip_symmetry.py
      - .github/workflows/publish-models-to-ghcr.yaml
  workflow_dispatch: {}

concurrency:
  group: publish-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:models-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.symmetry
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=model-worker
          cache-to: type=gha,scope=model-worker,mode=max
      - name: Verify native stack, adapter identity and credential isolation
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c '
          from gpx_recipe.symmetry.compiler import require_adapters,package_signature
          from gpx_recipe.symmetry.worker import runtime_identity,require_runtime
          from gpx_recipe.symmetry.resources import allocation
          from gpx_recipe.jobs import scientific_environment
          import os
          require_adapters()
          r=runtime_identity(); require_runtime(r,r["magnetic_function_sha256"])
          budget=allocation(4,environ={})
          assert 1 <= budget["workers"] <= 4
          if not budget["allocation_reported"]: assert budget["workers"]==1
          os.environ["GALAXY_API_KEY"]="must-not-transfer"
          os.environ["AZURE_ILLUMINE_API_KEY"]="must-not-transfer"
          os.environ["BCS_API_KEY"]="must-not-transfer"
          assert not any("KEY" in k or "TOKEN" in k for k in scientific_environment())
          print("Verified worker implementation",package_signature())'
          docker run --rm --entrypoint python "$IMAGE" -c '
          from pathlib import Path
          from gpx_recipe.structural_live.optimization import native_fast_candidate
          from gpx_recipe.structural_live.optimization.empirical_catalog import load_declared_catalog
          from gpx_recipe.structural_live.service import SearchSettings
          policy=Path(native_fast_candidate.__file__).with_name("empirical_chemistry_policy.json")
          assert load_declared_catalog(policy).fingerprint
          assert SearchSettings().starts >= 2
          print("Verified packaged structural service and contact data")'
          docker run --rm --entrypoint python "$IMAGE" /opt/radar-symmetry/ndip_model_campaign.py --help
      - name: Verify resource, protocol and runtime gates
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/validation:ro" "$IMAGE" -c '
          python -m pip install --quiet pytest &&
          export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}/validation/tests/gpx_recipe" &&
          python -c "import GSASII.GSASIIscriptable" &&
          python -m pytest -q -o cache_dir=/tmp/pytest-cache \
            /validation/tests/gpx_recipe/test_model_campaign_worker.py \
            /validation/tests/gpx_recipe/test_native_protocol.py \
            /validation/tests/gpx_recipe/test_symmetry_moment_models.py \
            /validation/tests/gpx_recipe/test_symmetry_campaign.py \
            /validation/tests/gpx_recipe/test_symmetry_runtime.py \
            /validation/tests/gpx_recipe/test_fixed_displacements.py \
            /validation/tests/gpx_recipe/test_project_view.py \
            /validation/tests/gpx_recipe/test_native_profiled.py \
            /validation/tests/gpx_recipe/test_profiled_cache_transport.py \
            /validation/tests/gpx_recipe/test_reflection_factors.py \
            /validation/tests/gpx_recipe/test_native_background.py \
            /validation/tests/gpx_recipe/test_native_peak_memo.py \
            /validation/tests/gpx_recipe/test_native_peak_precision.py \
            /validation/tests/gpx_recipe/test_native_axis_view.py \
            /validation/tests/gpx_recipe/test_native_reflection_memo.py \
            /validation/tests/gpx_recipe/test_structural_background_context.py \
            /validation/tests/gpx_recipe/test_quadratic_qualification.py \
            /validation/tests/gpx_recipe/test_preparation_authority.py \
            /validation/tests/gpx_recipe/test_preparation_magnetic_arrays.py \
            /validation/tests/gpx_recipe/test_native_forward.py \
            /validation/tests/gpx_recipe/test_profiled_magnetic.py \
            /validation/tests/gpx_recipe/test_grouped_profile_receipts.py \
            /validation/tests/gpx_recipe/test_grouped_native_parallelism.py \
            /validation/tests/gpx_recipe/test_prepared_magnetic_capture.py \
            /validation/tests/gpx_recipe/test_profiled_optimizer_contract.py \
            /validation/tests/gpx_recipe/test_structural_reduced_service.py \
            /validation/tests/gpx_recipe/test_structural_live_basis.py \
            /validation/tests/gpx_recipe/test_structural_live_native_profile.py \
            /validation/tests/gpx_recipe/test_structural_live_refinable_export.py \
            /validation/tests/gpx_recipe/test_profiled_solver_native.py'
      - name: Require structural prepare-fit-audit-export-continuation acceptance
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/validation:ro" "$IMAGE" -c '
          python -m pip install --quiet pytest &&
          export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}/validation/tests/gpx_recipe" &&
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 RADAR_REQUIRE_STRUCTURAL_NATIVE=1 &&
          python -m pytest -q -o cache_dir=/tmp/pytest-cache --junitxml=/tmp/structural.xml \
            /validation/tests/gpx_recipe/test_prepared_structural_acceptance_native.py \
            /validation/tests/gpx_recipe/test_structural_block_damping.py &&
          python -c "import xml.etree.ElementTree as E; cases=E.parse(\"/tmp/structural.xml\").findall(\".//testcase\"); assert len(cases)>=15 and all(c.find(\"skipped\") is None and c.find(\"failure\") is None and c.find(\"error\") is None for c in cases), \"Structural native acceptance must run without skips\""'
      - name: Require portable preparation and structural acquisition handoffs
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/validation:ro" "$IMAGE" -c '
          python -m pip install --quiet pytest &&
          export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}/validation/tests/gpx_recipe" &&
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 &&
          python -m pytest -q -o cache_dir=/tmp/pytest-cache --junitxml=/tmp/preparation.xml \
            /validation/tests/gpx_recipe/test_preparation_theory_native.py \
            /validation/tests/gpx_recipe/test_preparation_reference.py \
            /validation/tests/gpx_recipe/test_native_background_native.py \
            /validation/tests/gpx_recipe/test_native_background_benchmark_native.py \
            /validation/tests/gpx_recipe/test_structural_background_context_native.py \
            /validation/tests/gpx_recipe/test_native_peak_precision_native.py \
            /validation/tests/gpx_recipe/test_native_peak_memo_native.py \
            /validation/tests/gpx_recipe/test_native_peak_memo.py \
            /validation/tests/gpx_recipe/test_native_axis_view.py \
            /validation/tests/gpx_recipe/test_native_axis_view_native.py \
            /validation/tests/gpx_recipe/test_native_reflection_memo.py \
            /validation/tests/gpx_recipe/test_native_reflection_memo_native.py \
            /validation/tests/gpx_recipe/test_native_tof_scalars.py \
            /validation/tests/gpx_recipe/test_native_tof_forward.py \
            /validation/tests/gpx_recipe/test_native_tof_kernels.py \
            /validation/tests/gpx_recipe/test_native_kernel_pass.py \
            /validation/tests/gpx_recipe/test_native_kernel_geometry.py \
            /validation/tests/gpx_recipe/test_native_kernel_bank.py \
            /validation/tests/gpx_recipe/test_kernel_geometry_storage.py \
            /validation/tests/gpx_recipe/test_native_joint_profiled_fit.py \
            /validation/tests/gpx_recipe/test_tof_kernel_storage.py \
            /validation/tests/gpx_recipe/test_native_cell_proposals.py \
            /validation/tests/gpx_recipe/test_preparation_worker_native.py \
            /validation/tests/gpx_recipe/test_preparation_adaptation_native.py \
            /validation/tests/gpx_recipe/test_preparation_authority_native.py \
            /validation/tests/gpx_recipe/test_preparation_magnetic_authority_native.py \
            /validation/tests/gpx_recipe/test_preparation_rendered_magnetic.py \
            /validation/tests/gpx_recipe/test_preparation_identity.py \
            /validation/tests/gpx_recipe/test_prepared_rendered_oracle_native.py \
            /validation/tests/gpx_recipe/test_prepared_k_series_native.py \
            /validation/tests/gpx_recipe/test_prepared_model_handoff_native.py \
            /validation/tests/gpx_recipe/test_structural_snapshot_job_native.py &&
          python -c "import xml.etree.ElementTree as E; cases=E.parse(\"/tmp/preparation.xml\").findall(\".//testcase\"); assert len(cases)>=351 and all(c.find(\"skipped\") is None and c.find(\"failure\") is None and c.find(\"error\") is None for c in cases), \"Preparation native acceptance must run without skips\""'
      - name: Publish verified immutable image
        run: docker push "$IMAGE"
