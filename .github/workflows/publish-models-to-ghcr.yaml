            /validation/tests/gpx_recipe/test_profiled_solver_native.py'
      - name: Require structural prepare-fit-audit-export-continuation acceptance
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/validation:ro" "$IMAGE" -c '
          python -m pip install --quiet pytest &&
          export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}/validation/tests/gpx_recipe" &&
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 RADAR_REQUIRE_STRUCTURAL_NATIVE=1 &&
