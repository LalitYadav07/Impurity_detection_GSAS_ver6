name: Publish model campaign worker to GitHub Container Registry

on:
  push:
    branches: [birthright-container]
    paths:
      - Dockerfile.symmetry
      - .dockerignore
      - tests/test_production_image_payload.py
      - nova/src/gpx_recipe/**
      - nova/src/radar_pd_nova/data/powgen_calibrations/**
      - nova/src/radar_pd_nova/model_admission.py
      - nova/tools/check_powgen_planner_release.py
      - tests/gpx_recipe/**
      - scripts/ndip_model_campaign.py
      - scripts/ndip_runtime.py
      - scripts/ndip_symmetry.py
      - .github/workflows/publish-models-to-ghcr.yaml
  workflow_dispatch:
    inputs:
      image_variant:
        description: Worker image to qualify
        type: choice
        default: models
        options: [models, preparation-cuda]

concurrency:
  group: publish-models-${{ github.ref }}-${{ inputs.image_variant || 'models' }}
  cancel-in-progress: true

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        env:
          WORKER_VARIANT: ${{ inputs.image_variant || 'models' }}
        run: |
          case "$WORKER_VARIANT" in models|preparation-cuda) ;; *) exit 1 ;; esac
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${WORKER_VARIANT}-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.image_variant == 'preparation-cuda' && 'Dockerfile.preparation-cuda' || 'Dockerfile.symmetry' }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}
          cache-from: |
            type=gha,scope=model-worker
            type=gha,scope=model-worker-${{ inputs.image_variant || 'models' }}
          cache-to: type=gha,scope=model-worker-${{ inputs.image_variant || 'models' }},mode=max
      - name: Verify production image excludes development fixtures
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/tests/test_production_image_payload.py:/validation/test_production_image_payload.py:ro" \
            "$IMAGE" /validation/test_production_image_payload.py \
            --image-kind "${{ inputs.image_variant || 'models' }}"
      - name: Verify CUDA image and device-independent recovery contracts
        if: inputs.image_variant == 'preparation-cuda'
        run: |
          # Exercise the installed fixture closure without the source-checkout
          # mount; that mount must not conceal missing image dependencies.
          docker run --rm --entrypoint sh "$IMAGE" -c '
          export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}/opt/radar-cuda-validation" &&
          cd /tmp &&
          python -c "from pathlib import Path; from tempfile import TemporaryDirectory; from test_structural_paired_training_native import data; from test_structural_joint_modes_native import cohort; context=TemporaryDirectory(); root=Path(context.name); data(root/\"pairs\"); cohort(root/\"modes\"); print(\"Verified installed CUDA acceptance fixture closure\")"'
          docker run --rm --entrypoint sh -v "$PWD:/validation:ro" "$IMAGE" -c '
          export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}/validation/tests/gpx_recipe" &&
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 &&
          python -c "import torch; assert str(torch.__version__)==\"2.14.1+cu126\" and torch.version.cuda==\"12.6\"; print(\"CUDA wheel verified; GPU hardware acceptance is a separate NDIP gate\")" &&
          python -m pytest -q -o cache_dir=/tmp/pytest-cache \
            /validation/tests/gpx_recipe/test_structural_accelerator_checkpoint.py \
            /validation/tests/gpx_recipe/test_structural_training_cuda.py \
            -k "not real_cuda"'
      - name: Verify native stack, adapter identity and credential isolation
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c '
          from gpx_recipe.symmetry.compiler import require_adapters,package_signature
          from gpx_recipe.symmetry.worker import runtime_identity,require_runtime
          from gpx_recipe.symmetry.resources import allocation
          from gpx_recipe.jobs import scientific_environment
          import os
          require_adapters()
          r=runtime_identity(); require_runtime(r,r["magnetic_function_sha256"])
          from GSASII import GSASIIpwd
          from gpx_recipe.live.native_peak_batch import NativePeakBatch
          helper=NativePeakBatch(GSASIIpwd)
          assert helper.diagnostics()["interpolation"] is False
          assert hasattr(helper.library,"proposal_tof_profile_sum")
          budget=allocation(4,environ={})
          assert 1 <= budget["workers"] <= 4
          if not budget["allocation_reported"]: assert budget["workers"]==1
          os.environ["GALAXY_API_KEY"]="must-not-transfer"
          os.environ["AZURE_ILLUMINE_API_KEY"]="must-not-transfer"
          os.environ["BCS_API_KEY"]="must-not-transfer"
          assert not any("KEY" in k or "TOKEN" in k for k in scientific_environment())
          print("Verified worker implementation",package_signature())'
          docker run --rm --user 65534:65534 -e HOME=/tmp --entrypoint python "$IMAGE" -c '
          import numpy as np
          from GSASII import GSASIIpwd
          from gpx_recipe.live.native_peak_batch import NativePeakBatch
          helper=NativePeakBatch(GSASIIpwd)
          x=np.linspace(900.,1100.,401);p=np.array([1000.,.1,.1,4.,.5]);height=1.75
          expected=np.zeros_like(x)
          expected+=np.float64(height)*GSASIIpwd.getEpsVoigt(*p,x)[0]
          actual=helper.render({(1,0,0):(p,height,0,len(x))},x)
          assert actual.dtype==expected.dtype==np.dtype("float64")
          assert np.array_equal(actual,expected)
          print("Verified readable, array-identical native helper as non-root UID")'
          docker run --rm --entrypoint python "$IMAGE" -c '
          from pathlib import Path
          from gpx_recipe.structural_live.optimization import native_fast_candidate
          from gpx_recipe.structural_live.optimization.empirical_catalog import load_declared_catalog
          from gpx_recipe.structural_live.service import SearchSettings
          policy=Path(native_fast_candidate.__file__).with_name("empirical_chemistry_policy.json")
          assert load_declared_catalog(policy).fingerprint
          assert SearchSettings().starts >= 2
          print("Verified packaged structural service and contact data")'
          docker run --rm --entrypoint python "$IMAGE" /opt/radar-symmetry/ndip_model_campaign.py --help
      - name: Verify managed planner native calculation and numerical controls
        if: inputs.image_variant != 'preparation-cuda'
        run: |
          docker run --rm --entrypoint python "$IMAGE" \
            /opt/radar-symmetry/check_planner_installation.py /tmp/planner-installation-check

      - name: Verify installed structural-library admission contract and native guards
        if: inputs.image_variant != 'preparation-cuda'
        run: |
          docker run --rm --entrypoint sh -v "$PWD/tests/gpx_recipe:/validation:ro" "$IMAGE" -c '
          python -m pip install --quiet pytest &&
          export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}/validation" &&
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 RADAR_ADMISSION_PACKAGED=1 &&
          python -m pytest -q -o cache_dir=/tmp/pytest-cache \
            /validation/test_model_admission_contract.py \
            /validation/test_model_admission_native.py'

