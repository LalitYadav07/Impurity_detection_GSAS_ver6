name: Publish NOVA image to GitHub Container Registry

on:
  push:
    branches:
      - birthright-container
    paths:
      - nova/**
      - .github/workflows/publish-nova-to-ghcr.yaml
  workflow_dispatch: {}

concurrency:
  group: publish-nova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "NOVA_VERSION=$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' nova/pyproject.toml | head -1)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load NOVA image
        uses: docker/build-push-action@v6
        with:
          context: nova
          file: nova/dockerfiles/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:nova-${{ env.NOVA_VERSION }}
            ${{ env.IMAGE_NAME }}:nova-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:nova-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:nova-buildcache,mode=max

      - name: Smoke test packaged NOVA application
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" \
            -c 'from importlib.metadata import version; from radar_pd_nova.app import RadarPdNovaApp; actual = version("radar-pd-nova"); assert actual == "'"${NOVA_VERSION}"'", actual; print(actual, RadarPdNovaApp.__name__)'
          docker run --rm --entrypoint nginx \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -t

      - name: Push immutable and release tags
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:nova-${NOVA_VERSION}"
          docker push "${IMAGE_NAME}:nova-${GITHUB_SHA}"
