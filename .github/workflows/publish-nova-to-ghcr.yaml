name: Publish NOVA image to GitHub Container Registry

on:
  push:
    branches:
      - birthright-container
    paths:
      - nova/**
      - .github/workflows/publish-nova-to-ghcr.yaml
  workflow_dispatch: {}

concurrency:
  group: publish-nova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check cursor ownership and rendering order
        run: node nova/tests/client_cursor.test.js

      - name: Set image metadata
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "NOVA_VERSION=$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' nova/pyproject.toml | head -1)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load NOVA image
        uses: docker/build-push-action@v6
        with:
          context: nova
          file: nova/dockerfiles/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:nova-${{ env.NOVA_VERSION }}
            ${{ env.IMAGE_NAME }}:nova-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:nova-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:nova-buildcache,mode=max

      - name: Smoke test packaged NOVA application
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" \
            -c 'from importlib.metadata import version; from radar_pd_nova.app import RadarPdNovaApp; from radar_pd_nova.live_beamlines import BEAMLINES; from radar_pd_nova.nomad_controller import NomadExperimentSettings; from gpx_recipe.worker import work; actual = version("radar-pd-nova"); assert actual == "'"${NOVA_VERSION}"'", actual; assert not BEAMLINES["NOM"].automatic_profiles; assert NomadExperimentSettings("IPTS-1", "h", "c", selected_banks=(5,), profile_bank=1).definition().instrument == "NOM"; print(actual, RadarPdNovaApp.__name__, work.__name__, "NOMAD and refinement imports passed")'
          docker run --rm --entrypoint nginx \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -t
          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          from importlib.resources import files
          from radar_pd_nova.app import RadarPdNovaApp
          from radar_pd_nova.transition_signals import BoundaryPolicy
          from radar_pd_nova.transition_cursor_widget import TransitionCursor
          from radar_pd_nova.acquisition import acquisition_context
          from radar_pd_nova.nomad import run_number_from_filename, is_source_subfolder
          from radar_pd_nova.powgen_watch import WatchDefinition
          import scipy
          window = {"start":"2021-08-04T17:41:12.377953667-04:00","end":"2021-08-04T17:45:38.752968667-04:00"}
          context = acquisition_context({"conditions":{"$schema":"radar-pd-conditions/v1","acquisition_window":window,"channels":[]}}, instrument="PG3", run_number=1, source="/no-facility-file")
          assert context is not None and context["acquisition_window"] == window
          assert run_number_from_filename("NOM42tof.gsa") == 42
          assert is_source_subfolder("shared/autoNOM_example/GSAS")
          assert WatchDefinition("IPTS-1", "shared/autoNOM_example/GSAS", "h", "c", "p", instrument="NOM").instrument == "NOM"
          app = RadarPdNovaApp()
          assert "radar-transition-cursor" in app.layout.html
          assert "Reset zoom" in app.layout.html
          assert files("radar_pd_nova").joinpath("web/transition_cursor.js").is_file()
          assert scipy.__version__ == "1.15.3", scipy.__version__
          assert BoundaryPolicy().split_separation_fwhm == .1
          print("Packaged transition engine, cursor assets and interface imports passed")
          '
          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          import json
          from radar_pd_nova.uploads import browser_named_file_js
          print(json.dumps([
              {"handler":browser_named_file_js("decode_named"),"decode":"decode_named"},
              {"handler":browser_named_file_js("decode_cif",start_trigger="start_upload",source_type="CIF file"),"decode":"decode_cif","start":"start_upload","kind":"CIF file"},
              {"handler":browser_named_file_js("decode_zip",start_trigger="start_upload",source_type="ZIP archive"),"decode":"decode_zip","start":"start_upload","kind":"ZIP archive"},
          ]))
          ' > "${RUNNER_TEMP}/nova-upload-handlers.json"
          node nova/tests/client_upload.test.js "${RUNNER_TEMP}/nova-upload-handlers.json"

      - name: Verify packaged native and CLI sample-identity readers
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/nova/tests/verify_sample_identity.py:/tmp/verify_sample_identity.py:ro" \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" \
            /tmp/verify_sample_identity.py

      - name: Verify packaged User guide and NDIP session routes
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/nova/tests/verify_user_guide.py:/tmp/verify_user_guide.py:ro" \
            -v "$PWD/nova/dockerfiles/nginx.conf.template:/tmp/guide-nginx.conf.template:ro" \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" \
            /tmp/verify_user_guide.py --nginx-template /tmp/guide-nginx.conf.template

      - name: Verify packaged beamline profiles and condition contract
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          import hashlib
          import json
          from types import SimpleNamespace
          from radar_pd_nova.hb2a_profiles import ROOT, resolve_profile
          from radar_pd_nova.hb2a import _date
          from radar_pd_nova.live_beamlines import BEAMLINES
          from radar_pd_nova.snap_conditions import validate_bindings_json
          from radar_pd_nova.snap_controller import SnapExperimentSettings
          catalog = json.loads((ROOT / "catalog.json").read_text())
          assert _date("6/15/2024", "1:00:00 PM").isoformat() == "2024-06-15T13:00:00-04:00"
          assert _date("11/19/2025", "1:00:00 PM").isoformat() == "2025-11-19T13:00:00-05:00"
          assert len(catalog["profiles"]) == 52
          for entry in catalog["profiles"]:
              raw = (ROOT / entry["filename"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == entry["sha256"], entry["filename"]
              metadata = {"start_time": entry["start_date"] + "T12:00:00-04:00",
                          "end_time": entry["end_date"] + "T13:00:00-04:00",
                          "ge_reflection": entry["ge_reflection"], "collimator": entry["collimator"],
                          "nominal_wavelength_angstrom": {113: 2.41, 115: 1.54, 117: 1.12}[entry["ge_reflection"]]}
              path, mapping = resolve_profile(SimpleNamespace(metadata=metadata, two_theta_min=5., two_theta_max=155.))
              assert path.name == entry["filename"] and mapping["sha256"] == entry["sha256"]
          assert BEAMLINES["HB2A"].automatic_profiles and not BEAMLINES["SNAP"].automatic_profiles
          binding = {"temperature": {"channel": "LakeshoreSampleTemp", "unit": "K", "verified": True,
                     "product_window_reviewed": True, "scope_sha256": "a" * 64, "schema_sha256": "b" * 64}}
          assert validate_bindings_json(json.dumps(binding)) == binding
          settings = SnapExperimentSettings("IPTS-1", "h", "c", selected_banks=(1,),
                     product_family=json.dumps(["all", ""]), condition_bindings_json=json.dumps(binding, sort_keys=True))
          assert json.loads(settings.definition().config_refs["snap_conditions"]) == binding
          print("52 packaged HB-2A profiles and immutable SNAP condition contract passed")
          '

      - name: Push immutable and release tags
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:nova-${NOVA_VERSION}"
          docker push "${IMAGE_NAME}:nova-${GITHUB_SHA}"
