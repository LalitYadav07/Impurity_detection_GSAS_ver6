name: Publish NOVA image to GitHub Container Registry

on:
  push:
    branches:
      - birthright-container
    paths:
      - nova/**
      - .github/workflows/publish-nova-to-ghcr.yaml
  workflow_dispatch: {}

concurrency:
  group: publish-nova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check cursor ownership and rendering order
        run: node nova/tests/client_cursor.test.js

      - name: Set image metadata
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "NOVA_VERSION=$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' nova/pyproject.toml | head -1)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load NOVA image
        uses: docker/build-push-action@v6
        with:
          context: nova
          file: nova/dockerfiles/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:nova-${{ env.NOVA_VERSION }}
            ${{ env.IMAGE_NAME }}:nova-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:nova-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:nova-buildcache,mode=max

      - name: Smoke test packaged NOVA application
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" \
            -c 'from importlib.metadata import version; from radar_pd_nova.app import RadarPdNovaApp; from radar_pd_nova.live_beamlines import BEAMLINES; from radar_pd_nova.nomad_controller import NomadExperimentSettings; from gpx_recipe.worker import work; actual = version("radar-pd-nova"); assert actual == "'"${NOVA_VERSION}"'", actual; assert not BEAMLINES["NOM"].automatic_profiles; assert NomadExperimentSettings("IPTS-1", "h", "c", selected_banks=(5,), profile_bank=1).definition().instrument == "NOM"; print(actual, RadarPdNovaApp.__name__, work.__name__, "NOMAD and refinement imports passed")'
          docker run --rm --entrypoint nginx \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -t
          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          from importlib.resources import files
          from radar_pd_nova.app import RadarPdNovaApp
          from radar_pd_nova.transition_signals import BoundaryPolicy
          from radar_pd_nova.transition_cursor_widget import TransitionCursor
          from radar_pd_nova.acquisition import acquisition_context
          from radar_pd_nova.nomad import run_number_from_filename, is_source_subfolder
          from radar_pd_nova.powgen_watch import WatchDefinition
          import scipy
          window = {"start":"2021-08-04T17:41:12.377953667-04:00","end":"2021-08-04T17:45:38.752968667-04:00"}
          context = acquisition_context({"conditions":{"$schema":"radar-pd-conditions/v1","acquisition_window":window,"channels":[]}}, instrument="PG3", run_number=1, source="/no-facility-file")
          assert context is not None and context["acquisition_window"] == window
          assert run_number_from_filename("NOM42tof.gsa") == 42
          assert is_source_subfolder("shared/autoNOM_example/GSAS")
          assert WatchDefinition("IPTS-1", "shared/autoNOM_example/GSAS", "h", "c", "p", instrument="NOM").instrument == "NOM"
          app = RadarPdNovaApp()
          assert "radar-transition-cursor" in app.layout.html
          assert "Reset zoom" in app.layout.html
          assert files("radar_pd_nova").joinpath("web/transition_cursor.js").is_file()
          assert scipy.__version__ == "1.15.3", scipy.__version__
          assert BoundaryPolicy().split_separation_fwhm == .1
          print("Packaged transition engine, cursor assets and interface imports passed")
          '
          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          import json
          from radar_pd_nova.uploads import browser_named_file_js
          print(json.dumps([
              {"handler":browser_named_file_js("decode_named"),"decode":"decode_named"},
              {"handler":browser_named_file_js("decode_cif",start_trigger="start_upload",source_type="CIF file"),"decode":"decode_cif","start":"start_upload","kind":"CIF file"},
              {"handler":browser_named_file_js("decode_zip",start_trigger="start_upload",source_type="ZIP archive"),"decode":"decode_zip","start":"start_upload","kind":"ZIP archive"},
          ]))
          ' > "${RUNNER_TEMP}/nova-upload-handlers.json"
          node nova/tests/client_upload.test.js "${RUNNER_TEMP}/nova-upload-handlers.json"

          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          import json
          from pathlib import Path
          import trame_client
          from radar_pd_nova.feedback_ui import browser_private_delivery_js
          runtime=Path(trame_client.__file__).parent/"module/vue3-www/vue.global.js"
          print(json.dumps({"handler":browser_private_delivery_js(),"vue":runtime.read_text()}))
          ' > "${RUNNER_TEMP}/nova-feedback-client.json"
          node nova/tests/client_feedback.test.js "${RUNNER_TEMP}/nova-feedback-client.json"

      - name: Verify packaged Live, result recovery and transition regressions
        shell: bash
        run: |
          docker run --rm --entrypoint sh -v "$PWD/nova/tests:/validation-tests:ro" \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 -e MKL_NUM_THREADS=1 \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          python -m pip install --quiet pytest==8.4.2 &&
          cd /tmp &&
          PYTHONPATH=/src/src:/validation-tests python -m pytest -q \
            /validation-tests/test_live_assistant_language.py \
            /validation-tests/test_live_assistant.py \
            /validation-tests/test_live_assistant_integration.py \
            /validation-tests/test_live_assistant_inventory.py \
            /validation-tests/test_powgen_discovery_revisions.py \
            /validation-tests/test_webmon_cancelled_job.py \
            /validation-tests/test_unet_core_audit_regressions.py \
            /validation-tests/test_unet_engine_audit_regressions.py \
            /validation-tests/test_full_q_transition.py \
            /validation-tests/test_full_q_transition_ui.py \
            /validation-tests/test_unet_transition_ui_state.py \
            /validation-tests/test_result_collection_recovery.py \
            /validation-tests/test_result_background_repair.py \
            /validation-tests/test_refinement_detail_owner.py \
            /validation-tests/test_refinement_planner_payload.py'

      - name: Verify private feedback and reviewed profile setup
        shell: bash
        run: |
          docker run --rm --entrypoint sh -v "$PWD/nova/tests:/validation-tests:ro" \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          python -m pip install --quiet pytest==8.4.2 &&
          cd /tmp &&
          PYTHONPATH=/src/src:/validation-tests python -m pytest -q \
            /validation-tests/test_feedback.py \
            /validation-tests/test_post_demo_workflow.py \
            /validation-tests/test_refinement_execution_parameters.py'

      - name: Verify packaged magnetic optimizer setup and evidence
        shell: bash
        run: |
          docker run --rm --entrypoint sh -v "$PWD/nova/tests:/validation-tests:ro" \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          python -m pip install --quiet pytest &&
          mkdir -p /tmp/magnetic-tests &&
          cp /validation-tests/test_magnetic_optimizer_ui.py /validation-tests/test_model_planner.py \
             /validation-tests/test_symmetry_views.py /validation-tests/test_symmetry_pin_labels.py /tmp/magnetic-tests/ &&
          cd /tmp/magnetic-tests &&
          PYTHONPATH=/src/src python -m pytest -q test_magnetic_optimizer_ui.py test_model_planner.py \
            test_symmetry_views.py test_symmetry_pin_labels.py'

      - name: Verify packaged native and CLI sample-identity readers
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/nova/tests/verify_sample_identity.py:/tmp/verify_sample_identity.py:ro" \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" \
            /tmp/verify_sample_identity.py

      - name: Verify packaged preparation, profile and dispatch recovery
        shell: bash
        run: |
          docker run --rm --entrypoint sh -v "$PWD/nova/tests:/validation-tests:ro" \
            -v "$PWD/tests/gpx_recipe:/scientific-test-support:ro" \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          python -m pip install --quiet pytest==8.4.2 &&
          mkdir -p /tmp/model-recovery-tests &&
          cp /validation-tests/test_model_preparation_retry.py /validation-tests/test_model_runtime.py \
             /validation-tests/test_model_checkpoint_coalescing.py /validation-tests/test_model_enrollment.py \
             /validation-tests/test_checkpoint_uploads.py /validation-tests/test_model_checkpoint.py \
             /validation-tests/test_native_job_admission.py /validation-tests/test_restored_display_inputs.py \
             /validation-tests/test_live_admission_guard.py /validation-tests/test_restricted_watch_retention.py \
             /validation-tests/test_live_restore.py /validation-tests/test_nomad.py /validation-tests/test_snap.py \
             /validation-tests/test_powgen_controller.py /tmp/model-recovery-tests/ &&
          cd /tmp/model-recovery-tests &&
          PYTHONPATH=/src/src:/scientific-test-support python -m pytest -q test_model_preparation_retry.py test_model_runtime.py \
            test_model_checkpoint_coalescing.py test_model_enrollment.py test_checkpoint_uploads.py \
            test_model_checkpoint.py test_native_job_admission.py test_restored_display_inputs.py \
            test_live_admission_guard.py test_restricted_watch_retention.py'

      - name: Verify packaged experiment preparation and structural Live controls
        shell: bash
        run: |
          docker run --rm --entrypoint sh -v "$PWD/nova/tests:/validation-tests:ro" \
            -v "$PWD/tests/gpx_recipe:/scientific-test-support:ro" \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 -e MKL_NUM_THREADS=1 \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          python -m pip install --quiet pytest==8.4.2 &&
          cd /tmp &&
          PYTHONPATH=/src/src:/validation-tests:/scientific-test-support python -m pytest -q \
            /validation-tests/test_preparation_registry.py \
            /validation-tests/test_preparation_gpu_routing.py \
            /validation-tests/test_structural_input_transport.py \
            /validation-tests/test_native_operations.py \
            /validation-tests/test_preparation_queue.py \
            /validation-tests/test_preparation_training_continuation.py \
            /validation-tests/test_preparation_batch_queue.py \
            /validation-tests/test_preparation_history.py \
            /validation-tests/test_preparation_workspace.py \
            /validation-tests/test_preparation_controller.py \
            /validation-tests/test_preparation_labels.py \
            /validation-tests/test_preparation_training_record.py \
            /validation-tests/test_preparation_evidence.py \
            /validation-tests/test_structural_stream.py \
            /validation-tests/test_structural_snapshot_transport.py \
            /validation-tests/test_structural_snapshot_ranking.py \
            /validation-tests/test_structural_live_ui.py'

      - name: Verify packaged saved-watch recovery contracts
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from types import SimpleNamespace
          from radar_pd_nova.live_restore import inspect_checkpoint_payload
          from radar_pd_nova.powgen_controller import PowgenExperimentSettings, PowgenWatchController
          with TemporaryDirectory() as root:
              service = SimpleNamespace(history_id="history", output_root=Path(root))
              controller = PowgenWatchController(service, PowgenExperimentSettings("IPTS-1", "history", "config", "auto"))
              payload = json.loads(controller.capture_checkpoint().payload_json)
              review = inspect_checkpoint_payload(payload, service, "checkpoint", document_sha256="a"*64)
              assert not review.missing and not review.blocked
              payload["watch"].pop("settings")
              payload["watch"].pop("settings_schema")
              legacy = inspect_checkpoint_payload(payload, service, "checkpoint", document_sha256="b"*64)
              assert len(legacy.missing) == 7 and legacy.blocked
              assert not legacy.controller.state.completed
          print("Full and legacy stopped recovery contracts passed")
          '

      - name: Verify packaged User guide and NDIP session routes
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/nova/tests/verify_user_guide.py:/tmp/verify_user_guide.py:ro" \
            -v "$PWD/nova/dockerfiles/nginx.conf.template:/tmp/guide-nginx.conf.template:ro" \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" \
            /tmp/verify_user_guide.py --nginx-template /tmp/guide-nginx.conf.template

      - name: Verify packaged beamline profiles and condition contract
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            "${IMAGE_NAME}:nova-${NOVA_VERSION}" -c '
          import hashlib
          import json
          from types import SimpleNamespace
          from radar_pd_nova.hb2a_profiles import ROOT, resolve_profile
          from radar_pd_nova.hb2a import _date
          from radar_pd_nova.live_beamlines import BEAMLINES
          from radar_pd_nova.snap_conditions import validate_bindings_json
          from radar_pd_nova.snap_controller import SnapExperimentSettings
          catalog = json.loads((ROOT / "catalog.json").read_text())
          assert _date("6/15/2024", "1:00:00 PM").isoformat() == "2024-06-15T13:00:00-04:00"
          assert _date("11/19/2025", "1:00:00 PM").isoformat() == "2025-11-19T13:00:00-05:00"
          assert len(catalog["profiles"]) == 52
          for entry in catalog["profiles"]:
              raw = (ROOT / entry["filename"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == entry["sha256"], entry["filename"]
              metadata = {"start_time": entry["start_date"] + "T12:00:00-04:00",
                          "end_time": entry["end_date"] + "T13:00:00-04:00",
                          "ge_reflection": entry["ge_reflection"], "collimator": entry["collimator"],
                          "nominal_wavelength_angstrom": {113: 2.41, 115: 1.54, 117: 1.12}[entry["ge_reflection"]]}
              path, mapping = resolve_profile(SimpleNamespace(metadata=metadata, two_theta_min=5., two_theta_max=155.))
              assert path.name == entry["filename"] and mapping["sha256"] == entry["sha256"]
          assert BEAMLINES["HB2A"].automatic_profiles and not BEAMLINES["SNAP"].automatic_profiles
          binding = {"temperature": {"channel": "LakeshoreSampleTemp", "unit": "K", "verified": True,
                     "product_window_reviewed": True, "scope_sha256": "a" * 64, "schema_sha256": "b" * 64}}
          assert validate_bindings_json(json.dumps(binding)) == binding
          settings = SnapExperimentSettings("IPTS-1", "h", "c", selected_banks=(1,),
                     product_family=json.dumps(["all", ""]), condition_bindings_json=json.dumps(binding, sort_keys=True))
          assert json.loads(settings.definition().config_refs["snap_conditions"]) == binding
          print("52 packaged HB-2A profiles and immutable SNAP condition contract passed")
          '

      - name: Push immutable and release tags
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:nova-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == "refs/heads/birthright-container" ]]; then
            docker push "${IMAGE_NAME}:nova-${NOVA_VERSION}"
          fi
