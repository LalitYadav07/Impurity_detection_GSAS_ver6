name: Publish GSAS-II GUI image to GitHub Container Registry

on:
  push:
    branches:
      - birthright-container
    paths:
      - gsasii_gui/**
      - .github/workflows/publish-gsasii-gui-to-ghcr.yaml
  workflow_dispatch: {}

concurrency:
  group: publish-gsasii-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load GSAS-II GUI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gsasii_gui/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:gsasii-gui
            ${{ env.IMAGE_NAME }}:gsasii-gui-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:gsasii-gui-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:gsasii-gui-buildcache,mode=max

      - name: Smoke test GSAS-II and the noVNC gateway
        shell: bash
        run: |
          docker run --rm "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python -c "import GSASII; import wx; print(wx.version())"
          docker run --rm "${IMAGE_NAME}:gsasii-gui" \
            bash -n /opt/gsasii-gui/start.sh
          smoke_dir="$(mktemp -d)"
          chmod 0777 "${smoke_dir}"
          docker run --rm \
            -v "${smoke_dir}:/job" \
            "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python -c \
            'from GSASII import GSASIIscriptable as G2sc; G2sc.G2Project(newgpx="/job/input.gpx").save()'
          chmod 0666 "${smoke_dir}/input.gpx"
          set +e
          timeout 15 docker run --rm --user 12345:12345 \
            -e EP_PATH=/gsasii \
            -e GSASII_SOURCE_PROJECT=/job/input.gpx \
            -e GSASII_OUTPUT_PROJECT=/job/output.gpx \
            -v "${smoke_dir}:/job" \
            "${IMAGE_NAME}:gsasii-gui"
          smoke_status=$?
          set -e
          test "${smoke_status}" -eq 124
          test -s "${smoke_dir}/output.gpx"

      - name: Push Docker schema v2 manifests
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:gsasii-gui"
          docker push "${IMAGE_NAME}:gsasii-gui-${GITHUB_SHA}"
