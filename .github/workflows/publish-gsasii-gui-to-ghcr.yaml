name: Publish GSAS-II GUI image to GitHub Container Registry

on:
  push:
    branches:
      - birthright-container
    paths:
      - gsasii_gui/**
      - nova/src/gpx_recipe/symmetry/kernel_patch.py
      - nova/src/gpx_recipe/symmetry/space_group_patch.py
      - tests/gpx_recipe/kernel_geometry_control.py
      - tests/gpx_recipe/nuclear_powder_control.py
      - tests/gpx_recipe/test_desktop_numerics_native.py
      - .github/workflows/publish-gsasii-gui-to-ghcr.yaml
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the verified image (otherwise build and test only)
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-gsasii-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || inputs.publish_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load GSAS-II GUI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gsasii_gui/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:gsasii-gui
            ${{ env.IMAGE_NAME }}:gsasii-gui-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:gsasii-gui-buildcache
          cache-to: ${{ (github.event_name == 'push' || inputs.publish_image) && format('type=registry,ref={0}:gsasii-gui-buildcache,mode=max', env.IMAGE_NAME) || '' }}

      - name: Smoke test GSAS-II Python runtime
        shell: bash
        run: |
          docker run --rm "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python -c "import GSASII; import wx; print(wx.version())"
          docker run --rm "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python -c \
            "import importlib.metadata as m; assert m.version('websockify') == '0.13.0'"

      - name: Smoke test GSAS-II importer registry
        shell: bash
        run: |
          docker run --rm -i "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python - <<'PY'
          from GSASII import GSASIIfiles as G2fil

          for prefix in ("img", "pdf", "phase", "pwd", "rfd", "sad", "sfact"):
              G2fil.LoadImportRoutines(prefix)
          errors = G2fil.ImportErrorMsg()
          if errors:
              detail = " | ".join(str(item).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A") for item in errors)
              print(f"::error title=GSAS-II importer load errors::{detail}")
              raise SystemExit(1)
          print("No GSAS-II importer load errors")
          PY

      - name: Verify installed powder numerics and preserved desktop paths
        shell: bash
        run: |
          mkdir -p numerical-validation
          chmod 0777 numerical-validation
          docker run --rm -v "$PWD/numerical-validation:/reports" "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python /opt/gsasii-gui/kernel_geometry_control.py --installed \
            --output /reports/magnetic.json > numerical-validation/magnetic.log
          docker run --rm -v "$PWD/numerical-validation:/reports" "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python /opt/gsasii-gui/nuclear_powder_control.py --installed \
            --output /reports/nuclear.json > numerical-validation/nuclear.log
          docker run --rm -v "$PWD:/validation:ro" \
            -v "$PWD/numerical-validation:/reports" \
            -e RADAR_GSASII_DESKTOP_SOURCE=/opt/GSAS-II/GSASII \
            -e PYTHONPATH=/validation/nova/src \
            "${IMAGE_NAME}:gsasii-gui" bash -c '
            /opt/conda/bin/python -m pip install --quiet pytest==8.4.2 &&
            /opt/conda/bin/python -m pytest -q -o cache_dir=/tmp/pytest-cache \
              --junitxml=/reports/desktop-contracts.xml \
              /validation/tests/gpx_recipe/test_desktop_numerics_native.py'
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('numerical-validation/desktop-contracts.xml').iter('testcase'))
          assert len(cases) == 13, f'Expected 13 desktop checks, found {len(cases)}'
          assert not any(case.find(tag) is not None for case in cases
                         for tag in ('skipped', 'failure', 'error')), 'Desktop validation did not fully pass'
          PY

      - name: Upload desktop numerical validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsasii-desktop-numerics-${{ github.sha }}
          path: numerical-validation/
          if-no-files-found: ignore

      - name: Smoke test native Save As project preservation
        shell: bash
        run: |
          docker run --rm "${IMAGE_NAME}:gsasii-gui" bash -c '
            set -euo pipefail
            Xvfb :95 -screen 0 1280x800x24 -nolisten tcp >/tmp/save-as-xvfb.log 2>&1 &
            display_pid=$!
            trap "kill $display_pid 2>/dev/null || true" EXIT
            export DISPLAY=:95
            for attempt in $(seq 1 100); do
              if xdpyinfo -display :95 >/dev/null 2>&1; then break; fi
              sleep 0.1
            done
            /opt/conda/bin/python /opt/gsasii-gui/smoke_save_as.py /tmp/public-save-as-smoke
            /opt/conda/bin/python /opt/gsasii-gui/smoke_plot_window.py /tmp/public-plot-window-smoke
          '

      - name: Set up Node for the real noVNC client check
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Smoke test the noVNC gateway
        shell: bash
        run: |
          docker run --rm "${IMAGE_NAME}:gsasii-gui" \
            bash -n /opt/gsasii-gui/start.sh
          smoke_dir="$(mktemp -d)"
          chmod 0777 "${smoke_dir}"
          docker run --rm \
            -v "${smoke_dir}:/job" \
            "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python -c \
            'import os; from GSASII import GSASIIscriptable as G2sc; G2sc.G2Project(newgpx="/job/input.gpx").save(); os.chmod("/job/input.gpx", 0o666)'
          container_id="$(docker run --detach --user 12345:12345 \
            -e EP_PATH=/gsasii \
            -e GSASII_SOURCE_PROJECT=/job/input.gpx \
            -e GSASII_OUTPUT_PROJECT=/job/output.gpx \
            -e GSASII_OUTPUT_ARCHIVE=/job/exports.zip \
            -p 127.0.0.1:18080:8080 \
            -v "${smoke_dir}:/job" \
            "${IMAGE_NAME}:gsasii-gui")"
          cleanup() {
            if [[ -n "${container_id}" ]]; then
              docker logs "${container_id}" >/dev/null 2>&1 || true
              docker rm --force "${container_id}" >/dev/null 2>&1 || true
            fi
            rm -rf "${smoke_dir}"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18080/gsasii/healthz >/dev/null; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "${container_id}")" != "true" ]]; then
              echo "GSAS-II GUI container exited before becoming ready" >&2
              docker logs "${container_id}" >&2
              exit 1
            fi
            if [[ "${attempt}" -eq 120 ]]; then
              echo "GSAS-II GUI did not become ready within 60 seconds" >&2
              docker logs "${container_id}"
              exit 1
            fi
            sleep 0.5
          done
          curl --fail --silent --show-error --output /tmp/gsasii-vnc.html \
            http://127.0.0.1:18080/gsasii/vnc.html
          grep --quiet 'noVNC' /tmp/gsasii-vnc.html
          curl --silent --show-error --dump-header /tmp/gsasii-redirect.headers --output /dev/null \
            http://127.0.0.1:18080/gsasii
          grep --quiet '/gsasii/radar-launch.html' /tmp/gsasii-redirect.headers
          python - <<'PY'
          import socket
          from email import message_from_string
          from pathlib import Path
          from urllib.parse import urlsplit

          headers = Path('/tmp/gsasii-redirect.headers').read_text().split('\n', 1)[1]
          location = message_from_string(headers)['Location']
          launch_path = urlsplit(location).path
          assert launch_path == '/gsasii/radar-launch.html', launch_path
          # This checks the gateway endpoint only. The real browser below
          # checks the actual launch page and noVNC URL construction.
          websocket_path = launch_path.rsplit('/', 1)[0] + '/websockify'

          request = (
              f"GET {websocket_path} HTTP/1.1\r\n"
              "Host: 127.0.0.1:18080\r\n"
              "Upgrade: websocket\r\n"
              "Connection: Upgrade\r\n"
              "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
              "Sec-WebSocket-Version: 13\r\n"
              "Sec-WebSocket-Protocol: binary\r\n\r\n"
          )
          with socket.create_connection(("127.0.0.1", 18080), timeout=5) as connection:
              connection.sendall(request.encode("ascii"))
              response = connection.recv(4096)
          status = response.split(b"\r\n", 1)[0]
          if b" 101 " not in status:
              raise SystemExit(f"WebSocket upgrade failed: {status!r}")
          PY
          # Exercise the actual pinned browser client as well as the socket.
          # A successful HTTP page or hand-crafted upgrade cannot prove that
          # noVNC constructs the correct URL and completes its RFB connection.
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "${browser}"
          timeout 45 node gsasii_gui/scripts/smoke_novnc_client.mjs \
            "${browser}" http://127.0.0.1:18080/gsasii/
          docker stop --time 10 "${container_id}"
          test -s "${smoke_dir}/output.gpx"
          docker rm "${container_id}"
          container_id=""

      - name: Push Docker schema v2 manifests
        if: github.event_name == 'push' || inputs.publish_image
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:gsasii-gui-${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == "refs/heads/birthright-container" ]]; then
            docker push "${IMAGE_NAME}:gsasii-gui"
          fi
