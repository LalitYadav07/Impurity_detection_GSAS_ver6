name: Publish GSAS-II GUI image to GitHub Container Registry

on:
  push:
    branches:
      - birthright-container
    paths:
      - gsasii_gui/**
      - .github/workflows/publish-gsasii-gui-to-ghcr.yaml
  workflow_dispatch: {}

concurrency:
  group: publish-gsasii-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load GSAS-II GUI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gsasii_gui/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:gsasii-gui
            ${{ env.IMAGE_NAME }}:gsasii-gui-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:gsasii-gui-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:gsasii-gui-buildcache,mode=max

      - name: Smoke test GSAS-II Python runtime
        shell: bash
        run: |
          docker run --rm "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python -c "import GSASII; import wx; print(wx.version())"
          docker run --rm "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python -c \
            "import importlib.metadata as m; assert m.version('websockify') == '0.13.0'"

      - name: Smoke test GSAS-II importer registry
        shell: bash
        run: |
          docker run --rm -i "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python - <<'PY'
          from GSASII import GSASIIfiles as G2fil

          for prefix in ("img", "pdf", "phase", "pwd", "rfd", "sad", "sfact"):
              G2fil.LoadImportRoutines(prefix)
          errors = G2fil.ImportErrorMsg()
          if errors:
              detail = " | ".join(str(item).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A") for item in errors)
              print(f"::error title=GSAS-II importer load errors::{detail}")
              raise SystemExit(1)
          print("No GSAS-II importer load errors")
          PY

      - name: Smoke test the noVNC gateway
        shell: bash
        run: |
          docker run --rm "${IMAGE_NAME}:gsasii-gui" \
            bash -n /opt/gsasii-gui/start.sh
          smoke_dir="$(mktemp -d)"
          chmod 0777 "${smoke_dir}"
          docker run --rm \
            -v "${smoke_dir}:/job" \
            "${IMAGE_NAME}:gsasii-gui" \
            /opt/conda/bin/python -c \
            'import os; from GSASII import GSASIIscriptable as G2sc; G2sc.G2Project(newgpx="/job/input.gpx").save(); os.chmod("/job/input.gpx", 0o666)'
          container_id="$(docker run --detach --user 12345:12345 \
            -e EP_PATH=/gsasii \
            -e GSASII_SOURCE_PROJECT=/job/input.gpx \
            -e GSASII_OUTPUT_PROJECT=/job/output.gpx \
            -e GSASII_OUTPUT_ARCHIVE=/job/exports.zip \
            -p 127.0.0.1:18080:8080 \
            -v "${smoke_dir}:/job" \
            "${IMAGE_NAME}:gsasii-gui")"
          cleanup() {
            if [[ -n "${container_id}" ]]; then
              docker logs "${container_id}" >/dev/null 2>&1 || true
              docker rm --force "${container_id}" >/dev/null 2>&1 || true
            fi
            rm -rf "${smoke_dir}"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18080/gsasii/healthz >/dev/null; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "${container_id}")" != "true" ]]; then
              echo "GSAS-II GUI container exited before becoming ready" >&2
              docker logs "${container_id}" >&2
              exit 1
            fi
            if [[ "${attempt}" -eq 120 ]]; then
              echo "GSAS-II GUI did not become ready within 60 seconds" >&2
              docker logs "${container_id}"
              exit 1
            fi
            sleep 0.5
          done
          curl --fail --silent --show-error --output /tmp/gsasii-vnc.html \
            http://127.0.0.1:18080/gsasii/vnc.html
          grep --quiet 'noVNC' /tmp/gsasii-vnc.html
          curl --silent --show-error --dump-header /tmp/gsasii-redirect.headers --output /dev/null \
            http://127.0.0.1:18080/gsasii
          grep --quiet 'path=gsasii/websockify' /tmp/gsasii-redirect.headers
          python - <<'PY'
          import socket

          request = (
              "GET /gsasii/websockify HTTP/1.1\r\n"
              "Host: 127.0.0.1:18080\r\n"
              "Upgrade: websocket\r\n"
              "Connection: Upgrade\r\n"
              "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
              "Sec-WebSocket-Version: 13\r\n"
              "Sec-WebSocket-Protocol: binary\r\n\r\n"
          )
          with socket.create_connection(("127.0.0.1", 18080), timeout=5) as connection:
              connection.sendall(request.encode("ascii"))
              response = connection.recv(4096)
          status = response.split(b"\r\n", 1)[0]
          if b" 101 " not in status:
              raise SystemExit(f"WebSocket upgrade failed: {status!r}")
          PY
          docker stop --time 10 "${container_id}"
          test -s "${smoke_dir}/output.gpx"
          docker rm "${container_id}"
          container_id=""

      - name: Push Docker schema v2 manifests
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:gsasii-gui"
          docker push "${IMAGE_NAME}:gsasii-gui-${GITHUB_SHA}"
